name: Build 1C Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t my-1c-server .

    - name: Test image
      run: docker run --rm my-1c-server ls /opt/1cv8/x86_64/
